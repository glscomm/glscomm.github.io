function render(){

    b32.fill(bc);

    b32.fill(bc);

      const k=cy*COLS+cx;let f=FG[k],b=BG[k]<0?scrBg:BG[k];
      let inv=false;
      if(flash&&cx>=flash.x&&cx<flash.x+flash.w&&cy>=flash.y&&cy<flash.y+flash.h)inv=true;
      if(cursor&&blink&&cursor.x===cx&&cursor.y===cy)inv=!inv;
      if(inv){const tmp=f;f=b;b=tmp}
      const fc=P32[f],gc=P32[b],gl=FONT[CH[k]]||FONT['?'];
      for(let r=0;r<8;r++){const bits=gl[r];let p=(BY+cy*8+r)*W+BX+cx*8;

function toC(v){return BigInt(Math.round(Number(v)*100))}

    button(1,fy,8,3,'\u25c4 PREC',TB.kbg,TB.kfg,()=>{pos=(pos-1+list.length)%list.length;sfx.page();draw()},['PREV']);

/* ===== Cerca una sigla ===== */
let q='';
function cerca(){show(function draw(){scr();header('CERCA UNA SIGLA','',TB.hbg,TB.hfg,mainMenu);
    put(1,4,'Hai visto una targa vecchia?',LBLU);put(1,5,'Scrivi la sigla:',LBLU);
    const box=q==='ROMA'?' ROMA ':' '+(q+'__').slice(0,2)+' ';put(18,5,box,BLU,WHT);if(q.length<2)cursor={x:19+q.length,y:5};
    const kb=ROWS-13;let y=7;const maxY=kb-2;
    const out=(s,c,bg)=>{if(y<=maxY){put(1,y,s,c,bg)}y++};
    if(q.length>=2){const s=q==='ROMA'?'RM':q,cur=BYS[s],olds=OLD.filter(o=>o.s===q);
      if(cur!==undefined&&(q!=='RM')){const d=DATA[cur];out('OGGI:',LBLU);const y0=y;
        out(' '+pad(d.n.slice(0,CW-2),CW-1),WHT,LBLU);out(' '+pad(REG[d.r][0]+' \u00b7 SCHEDA \u25ba',CW-1),WHT,LBLU);hotspot(1,y0,CW,2,()=>scheda([cur],0,cerca));y++}
      if(q==='RM'){out('RM:',LBLU);wrap('La sigla tecnica di Roma: sulle targhe per\u00f2 c\'\u00e8 il nome intero, Roma. RM l\'hanno usata solo filobus e roulotte della Protezione civile.',CW).forEach(l=>out(l,WHT));y++;
        const y0=y;out(' '+pad('Roma \u00b7 SCHEDA \u25ba',CW-1),WHT,LBLU);hotspot(1,y0,CW,1,()=>scheda([BYS.RM],0,cerca));y++}
      if(olds.length){out(cur!==undefined?'UNA VOLTA ANCHE:':'SOLO SULLE TARGHE VECCHIE:',LBLU);
        olds.forEach(o=>{out(o.n,WHT);wrap(o.d,CW).forEach(l=>out(l,LBLU));y++})}
      if(cur===undefined&&!olds.length){out('NESSUNA PROVINCIA',WHT);out('HA LA SIGLA '+q+'.',WHT);y++;
        wrap('Di solito la sigla usa lettere del nome della citt\u00e0, ma non sempre le prime due: per esempio SP \u00e8 La Spezia e AQ \u00e8 L\'Aquila.',CW).forEach(l=>out(l,LBLU))}
    }else wrap('Tocca due lettere qui sotto. Ti dico a quale provincia corrispondono oggi e cosa volevano dire sulle targhe di una volta.',CW).forEach(l=>out(l,LBLU));
    const keys='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').concat(['DEL','ROMA']);
    keys.forEach((k,i)=>{const col=i%7,row=Math.floor(i/7),x=1+col*4,yy=kb+row*3,alt=(col+row)%2;
      button(x,yy,4,3,k,alt?WHT:LBLU,alt?BLU:WHT,()=>key(k),[k])});
  },mainMenu)}
function key(k){if(k==='DEL'){q=q==='ROMA'?'':q.slice(0,-1)}else if(k==='ROMA'){q='ROMA'}else{if(q.length>=2)q='';q+=k}
  if(q.length>=2){const s=q==='ROMA'?'RM':q;if(BYS[s]!==undefined||OLD.some(o=>o.s===q))sfx.ok();else sfx.err()}cerca()}

/* ===== Sigle scomparse ===== */
function scomparse(){const items=[['p','Sigle che trovi sulle targhe vecchie e che oggi non indicano pi\u00f9 quella provincia, o non indicano pi\u00f9 niente.'],['gap']];
  OLD.forEach(o=>{items.push(['lines',[[[0,' '+o.s+' ',BLU,WHT],[5,o.n.slice(0,CW-5),WHT]]]]);items.push(['p',o.d+(o.to&&o.to!==o.s&&o.d.indexOf('Oggi')<0?' Oggi: '+o.to+'.':'')])});

/* ===== Accensione e caricamento da cassetta ===== */
let skipFlag=false,wake=null;
const w=ms=>new Promise(r=>{wake=r;setTimeout(r,ms)});
/* BASIC iniziale: RUN avvia il caricamento; il gesto abilita audio e schermo intero. */
function power(){show(function draw(){mode='text';bootLines=[];typing='';bootScreen();
  button(7,Math.floor(ROWS/2)-2,15,5,['RUN','','AVVIO'],WHT,BLK,()=>{audioInit();goFull();boot()},['OK','R']);
},null)}
async function boot(){skipFlag=false;cur=bootScreen;anyTap=null;hot=[];
  mode='text';bootLines=[];typing='';bootScreen();await w(900);if(skipFlag)return;
  await type('LOAD"PROVINCE"');if(skipFlag)return;await w(250);
  bootLines.push('');bootLines.push('PRESS PLAY ON TAPE');bootScreen(true);await w(900);if(skipFlag)return;
  bootLines.push('OK');bootScreen(true);await w(400);if(skipFlag)return;
  bootLines.push('');bootLines.push('SEARCHING FOR PROVINCE');bootScreen(true);await w(300);if(skipFlag)return;
  mode='pilot';tapeOn();await w(1100);if(skipFlag)return;
  mode='text';tapeOff();bootLines.push('FOUND PROVINCE');bootScreen(true);await w(800);if(skipFlag)return;
  mode='data';tapeOn();await w(2200);if(skipFlag)return;
  mode='text';tapeOff();bootLines.push('LOADING');bootLines.push('READY.');bootScreen();await w(500);if(skipFlag)return;
  await type('RUN');if(skipFlag)return;await w(400);if(skipFlag)return;endBoot()}
let bootLines=[],typing='';
function bootScreen(nocur){cls(BLU,LBLU,LBLU);center(1,'*** COMMODORE 64 BASIC V2 ***');put(0,3,' 64K RAM SYSTEM');put(0,4,' 38911 BASIC BYTES FREE');put(0,6,'READY.');
  let y=7;bootLines.forEach(l=>{put(0,y,l);y++});if(typing!==null)put(0,y,typing);if(!nocur)cursor={x:typing?typing.length:0,y:y}}
async function type(s){typing='';for(const c of s){typing+=c;bootScreen();sfx.click();await w(110);if(skipFlag)return}
  bootLines.push(typing);typing='';bootScreen()}
function endBoot(){anyTap=null;tapeOff();mode='text';typing='';sfx.sel();mainMenu()}
/* ===== Avvio ===== */
window.addEventListener('resize',()=>{layout()});
layout();power();requestAnimationFrame(loop);
