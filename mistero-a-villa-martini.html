const scr={ch:new Array(1000).fill(' '),fg:new Uint8Array(1000),rv:new Uint8Array(1000),border:14,bg:6,cx:0,cy:0,col:14,rvs:false,dirty:true,blank:0,cursor:false};

function ctl(t,v){

const EXITS=[null,[5,3,0,2],[4,1,101,100],[104,103,102,1],[0,6,2,0],[6,0,1,0],[0,0,5,4],[102,105,0,0],[0,107,106,103],[106,0,0,105],[0,0,0,107],[0,0,104,108],[0,108,109,0],[109,100,0,110],[101,110,0,0]];
const DOORS=[[2,13],[2,14],[3,7],[3,8],[3,11],[7,9],[8,9],[8,10],[11,12],[12,13],[13,14]];
const DIRS=['Nord','Est','Sud','Ovest'],DIRK=['N','E','S','O'];
function item(i){if(i===0)return 'niente';if(i<23)return S[i][0];if(i===23)return 'il passe-partout';return 'la chiave '+RM[i-17][2];}

/* ===== Stato ===== */
// P[1..31] posizione oggetti (negativo = nascosto, 100+n = portato dal giocatore n)
// P[32] assassino, P[33] arma (1-12), P[34] stanza del corpo, P[35] vittima, P[36..41] stanza giocatori, P[42..47] oggetto portato, P[49] giocatori, P[50] eliminati
let G=null;
const SAVE='villaMartini.save';
function save(){try{localStorage.setItem(SAVE,JSON.stringify(G));}catch(e){}}
function loadSave(){try{const g=JSON.parse(localStorage.getItem(SAVE));if(g&&g.v===1&&Array.isArray(g.P))return g;}catch(e){}return null;}
function newGame(n){
  const P=new Array(51).fill(0);
  for(let j=1;j<=10;j++)P[j]=rnd(11)+3;
  for(let j=11;j<=22;j++)P[j]=rnd(13)+1;
  for(let j=24;j<=31;j++)P[j]=4;
  P[23]=rnd(8)+6;
  let j=rnd(10);P[35]=j;P[34]=P[j];P[j]=0;
  do{j=rnd(10);}while(P[j]===0);
  P[32]=j;P[j]=0;j=rnd(12);P[33]=j;P[j+10]=0;
  for(j=1;j<=22;j++)if(Math.random()<=.75)P[j]=-P[j];
  const D=DOORS.map(()=>Math.random()<.9);
  P[49]=n;for(j=1;j<=n;j++)P[35+j]=1;
  G={v:1,P,D,C:['','','','','','',''],Q:1};
}
function keyCheck(z){const i=G.P[41+G.Q];if(i<23||i>31)return 0;if(i===23)return -1;const r=i-17;return (r===DOORS[z][0]||r===DOORS[z][1])?1:0;}

/* ===== Avvio: schermo blu del C64 e caricamento da cassetta ===== */
async function wait(ms){const t=Date.now();while(Date.now()-t<ms){if(skipBoot)return;await sleep(20);}}
async function typeOut(s){for(const c of s){if(skipBoot)return;putc(c);await sleep(90);}nl();}

  await wait(400);
  pr('{d}    **** COMMODORE 64 BASIC V2 ****');pr('{d} 64K RAM SYSTEM  38911 BASIC BYTES FREE');pr('{d}READY.');
  scr.cursor=true;await wait(900);
  if(!skipBoot)await typeOut('LOAD');
  scr.cursor=false;
  if(!skipBoot){pr('{d}PRESS PLAY ON TAPE');await wait(1100);}
  if(!skipBoot){pr('OK');await wait(500);}
  if(!skipBoot){scr.blank=1;await wait(1300);scr.blank=0;scr.dirty=true;pr('{d}FOUND MISTERO A VILLA');await wait(1100);}
  if(!skipBoot){scr.blank=2;led.classList.add('on');await wait(2600);led.classList.remove('on');scr.blank=0;scr.dirty=true;pr('LOADING');await wait(500);pr('READY.');scr.cursor=true;await wait(500);}

 V:['\u2588    \u2588','\u2588    \u2588','\u25e5\u2588  \u2588\u25e4',' \u25e5\u2588\u2588\u25e4 ','  \u25e5\u25e4  ']};
function bigAt(L,row,col,color,word){scr.col=color;for(let i=0;i<5;i++){scr.cy=row+i;scr.cx=col;for(const c of BIG[L][i]){if(c===' ')scr.cx++;else putc(c);}if(i===2&&word){scr.cx=col+7;pr(word,false);}}scr.dirty=true;}

  const sv=loadSave();scr.col=0;scr.cy=21;scr.cx=0;pr('      QUANTI GIOCATORI (1-6) ?');
  scr.col=11;pr('{d}  {r}I{o} istruzioni'+(sv?'   {r}C{o} continua la partita':''));

  if(k==='I'){await istruzioni();return title2();}

}
async function page(lines){scr.border=0;scr.bg=1;scr.col=11;clr();for(const l of lines){if(l.startsWith('#')){scr.col=0;pr(l.slice(1));scr.col=11;}else prw(l);}scr.cy=24;scr.cx=0;scr.col=0;pr('     Premi {r}RETURN{o} per continuare',false);await getk(['RETURN']);}
async function istruzioni(){
  await page(['#{r} ISTRUZIONI {o} (1/3)','',"Durante una festa a Villa Martini uno dei dieci ospiti e' stato ucciso. L'assassino e' un altro degli ospiti.",'','#Dovete scoprire quattro cose:','  1 la vittima','  2 l\'assassino','  3 l\'arma','  4 la stanza del delitto','',"La vittima e' quella di cui trovate il corpo, e la stanza e' quella dove giace il corpo.","L'assassino e' l'unico ospite che non troverete mai in giro per la villa, e l'arma e' l'unica delle dodici che non troverete mai."]);
  await page(['#{r} ISTRUZIONI {o} (2/3)','',"Molti ospiti e oggetti sono nascosti: per trovarli usate CERCA, anche piu' volte nella stessa stanza.",'',"Quasi tutte le porte sono chiuse a chiave. Le chiavi delle stanze sono nella Dispensa, il passe-partout e' da qualche parte nella villa e apre ogni porta.",'',"Si porta un solo oggetto alla volta. Con la chiave giusta potete richiudere una porta dietro di voi.",'',"A ogni turno potete passare in una stanza vicina e poi fare una sola azione.",'',"In piu' giocatori, ognuno sceglie un codice segreto di due tasti. Chi accusa e sbaglia esce dal gioco."]);
  const os=[];for(let i=1;i<=10;i++)os.push(cap(S[i][0]));const ar=[];for(let i=11;i<=22;i++)ar.push(cap(S[i][0]));
  await page(['#{r} ISTRUZIONI {o} (3/3)','','#Gli ospiti:',os.join(', ')+'.','','#Le armi:',ar.join(', ')+'.','','#Le stanze:','Ingresso, Corridoio, Salone, Dispensa, Sala da pranzo, Cucina, Studio, Camera da letto, Bagno, Ripostiglio, Serra, Giardino, Piscina, Garage.']);
}

/* ===== Una partita ===== */
function header(){scr.border=12;scr.bg=15;scr.col=0;clr();pr('{d}{c0}{r} GIOCATORE N.'+G.Q+' {o}{c11} ---------------------');}
async function code2(){const a=await getk();putc('*');const b=await getk();putc('*');nl();return a+b;}
async function input(prompt){for(;;){pr(prompt+'? ',false);let s='';scr.cursor=true;kq.length=0;for(;;){const k=await key();if(k==='RETURN')break;if(k==='DEL'){if(s.length){s=s.slice(0,-1);backsp();}continue;}if(s.length<8){s+=k;putc(k);}}scr.cursor=false;scr.dirty=true;nl();if(/^\s*\d+\s*$/.test(s))return parseInt(s,10);pr('?REDO FROM START');}}
async function pressRet(msg){scr.col=0;pr(msg);await getk(['RETURN']);}
function showRoom(R){
  const P=G.P,Q=G.Q;P[Q+35]=R;scr.col=0;pr('{d}Sei '+RM[R][1]+'.');
  scr.col=11;prw('Porti con te: '+item(P[Q+41])+'.');
  scr.col=0;pr('Qui vedi:');scr.col=11;let j=0;
  for(let i=1;i<=31;i++)if(P[i]===R){j++;prw('   '+cap(item(i))+'.',3);}
  for(let i=1;i<=6;i++)if(i!==Q&&P[35+i]===R){pr('   Il giocatore n.'+i+'.');j++;}
  if(P[34]===R){prw('   Il cadavere '+S[P[35]][1]+'.',3);j++;}
  if(j===0)pr('   Niente di interessante.');
}
async function turn(){
  const P=G.P;save();
  for(;;){
    header();
    if(!G.C[G.Q]){scr.col=11;pr('{d}Premi due tasti a tua scelta: saranno il');pr('tuo CODICE SEGRETO. Con questo codice');pr("nessun altro potra' giocare al posto tuo!");scr.col=0;pr('{d}Inserisci ora il codice: ',false);G.C[G.Q]=await code2();save();break;}
    scr.col=0;pr('{d}Inserisci il tuo codice segreto: ',false);const c=await code2();
    if(c===G.C[G.Q])break;scr.col=11;pr('{d}Codice sbagliato!');await tune(T_WRONG,'sawtooth',.4);
  }
  header();const Q=G.Q;let R=P[35+Q];
  scr.col=11;pr('{d}Sei '+RM[R][1]+'.');scr.col=0;
  pr('{d}Vuoi uscire da questa stanza ({r}S{o}/{r}N{o}) ?');
  let k=await getk(['S','N']);
  if(k==='N'){pr('No');}
  else{
    pr("Si'");const V=EXITS[R];scr.col=11;pr('{d}Ci sono porte o passaggi verso:');
    for(let j=0;j<4;j++)if(V[j]!==0)pr('    '+DIRS[j]);
    scr.col=0;pr('{d}Premi {r}N{o}, {r}E{o}, {r}S{o} oppure {r}O{o} per muoverti!');
    k=await getk(DIRK);const d=DIRK.indexOf(k);scr.col=11;pr('Verso '+DIRS[d]);
    const v=V[d];
    if(v<1){pr("Da questa parte non c'e' nessuna porta.");pr('Non puoi muoverti.');await sleep(2200);}
    else if(v<100){R=v;pr('Passi nella stanza accanto.');await sleep(1000);}
    else{
      const z=v-100;let go=true;
      if(G.D[z]){pr("La porta e' chiusa a chiave.");const a=keyCheck(z);
        if(a===0){pr('Non hai la chiave giusta.');pr('Resti dove sei.');await sleep(2200);go=false;}
        else{pr('La tua chiave apre la porta.');G.D[z]=false;pr('Passi nella stanza accanto.');}}
      if(go){R=DOORS[z][0]===R?DOORS[z][1]:DOORS[z][0];
        if(keyCheck(z)===1){scr.col=0;pr('{d}Vuoi chiudere a chiave la porta dietro');pr('di te ({r}S{o}/{r}N{o}) ?');k=await getk(['S','N']);
          if(k==='S'){pr("Si'");G.D[z]=true;scr.col=11;pr('Porta chiusa a chiave.');}else pr('No');}}
    }
  }
  showRoom(R);
  scr.col=0;pr('{d}Premi {r}RETURN{o} per le azioni....');await getk(['RETURN']);
  // menu azioni
  scr.col=0;clr();
  pr('{d}{d}     {c0}>>>>>  COSA VUOI FARE?  <<<<<');pr('');
  const M=[['A',"Accusa l'assassino!"],['L',"Lascia l'oggetto che porti"],['N','Nascondi un oggetto o una persona'],['S','Stai fermo, nessuna azione'],['D','Deruba un altro giocatore'],['C','Cerca oggetti e persone nascosti'],['P','Prendi un oggetto']];
  for(const [l,t] of M)pr('{d}  {c11}{r}'+l+'{o} '+t);
  pr('');pr('{d}{c0}  Premi la lettera della tua scelta!');
  k=await getk(M.map(m=>m[0]));
  clr();scr.col=0;
  let over=false;
  if(k==='A')over=await accusa(R);
  else if(k==='L')lascia();
  else if(k==='N')await nascondi(R);
  else if(k==='S'){pr('{d}   ***  NESSUNA AZIONE  ***');}
  else if(k==='D')await deruba(R);
  else if(k==='C')cerca(R);
  else if(k==='P')await prendi(R);
  if(over)return true;
  // fine turno
  scr.col=0;pr('{d}Premi {r}RETURN{o} per finire il turno!');await getk(['RETURN']);
  scr.col=11;pr('{d}  {c0}{r} GIOCATORE N.'+G.Q+' {o}{c11}=========  {c0}FINE TURNO');
  await tune(T_TURN,'sawtooth',.35);
  do{G.Q++;if(G.Q>P[49])G.Q=1;}while(P[G.Q+35]===0);
  return false;
}
function dropCarried(){const P=G.P,Q=G.Q,i=P[Q+41];if(i===0)return 0;P[i]=P[Q+35];P[Q+41]=0;return i;}
function lascia(){pr('{d}   ***  LASCIA UN OGGETTO  ***');scr.col=11;const i=dropCarried();if(i===0)pr("{d}Non avevi niente con te!");else prw('Lasci '+item(i)+'.');}
async function prendi(R){
  const P=G.P,Q=G.Q;pr('{d}   ***  PRENDI UN OGGETTO  ***');scr.col=11;pr('{d}Puoi prendere questi oggetti:');
  const L=[];for(let i=11;i<=31;i++)if(P[i]===R){L.push(i);prw(L.length+': '+cap(item(i))+'.',3);}
  if(!L.length){pr('Nessun oggetto.');return;}
  scr.col=0;pr("{d}Scrivi il numero dell'oggetto da");pr('prendere, oppure 0 per non prendere nulla.');
  let a;do{a=await input('Quale oggetto vuoi');}while(a<0||a>L.length);
  scr.col=11;if(a===0){pr('Non prendi niente.');return;}
  const d=dropCarried();if(d)prw('Lasci '+item(d)+'.');const i=L[a-1];P[i]=100+Q;P[Q+41]=i;prw('Prendi '+item(i)+'.');
}
async function deruba(R){
  const P=G.P,Q=G.Q;pr('{d}   ***  DERUBA UN GIOCATORE  ***');scr.col=11;pr('{d}Nella stanza ci sono anche questi');pr('giocatori...');let j=0;
  for(let i=1;i<=6;i++)if(P[35+i]===R&&i!==Q){pr('   Il giocatore n.'+i+'.');j++;}
  if(!j){pr('   Non ci sono altri giocatori qui!');return;}
  for(;;){scr.col=0;pr('{d}Quale giocatore vuoi derubare?');pr('Scrivi il numero, oppure 0.');
    let a;for(;;){a=await input('Derubi il giocatore n.');if(a>P[49])break;if(a===Q){scr.col=11;pr('Non puoi derubare te stesso!');scr.col=0;continue;}break;}
    if(a>P[49])continue;
    scr.col=11;if(a===0){pr('Nessun furto.');return;}
    if(P[35+a]!==R){pr("Il giocatore n."+a+" non e' qui!");continue;}
    const d=dropCarried();if(d)prw('Lasci '+item(d)+'.');
    const i=P[a+41];if(i===0){pr('Il giocatore n.'+a+' non aveva niente!');return;}
    P[Q+41]=i;P[a+41]=0;P[i]=100+Q;prw('Prendi '+item(i)+'.');return;}
}
function cerca(R){
  const P=G.P;pr('{d}   ***  CERCA NELLA STANZA  ***');scr.col=11;pr('{d}Trovi:');let j=0;
  for(let i=1;i<=31;i++){if(P[i]!==-R)continue;if(Math.random()>.5)continue;j++;prw('    '+cap(item(i))+'.',4);P[i]=R;}
  if(P[34]===-R&&Math.random()<=.5){j++;prw('    Il cadavere '+S[P[35]][1]+'!',4);P[34]=R;}
  if(!j)pr('    ------ Niente!');
}
async function nascondi(R){
  const P=G.P,Q=G.Q;pr('{d}   ***  NASCONDI  ***');scr.col=11;pr('{d}Puoi nascondere:');const L=[];
  for(let i=1;i<=31;i++)if(P[i]===R){L.push(i);prw(L.length+': '+cap(item(i))+'.',3);}
  if(P[Q+41]){L.push(Q+41);prw(L.length+': '+cap(item(P[Q+41]))+' (lo porti tu).',3);}
  if(P[34]===R){L.push(34);prw(L.length+': Il cadavere '+S[P[35]][1]+'.',3);}
  if(!L.length){pr("Qui non c'e' niente da nascondere!");return;}
  scr.col=0;pr("{d}Scrivi il numero di cio' che vuoi");pr('nascondere, oppure 0 per non nascondere.');
  let a;do{a=await input('Cosa nascondi');}while(a<0||a>L.length);
  scr.col=11;if(a===0){pr('Non nascondi niente.');return;}
  const i=L[a-1];
  if(i>34){const it=P[Q+41];P[Q+41]=0;P[it]=-R;prw("Nascondi l'oggetto che portavi: "+item(it)+'.');return;}
  P[i]=-R;if(i===34)pr('Nascondi il cadavere.');else prw('Nascondi '+item(i)+'.');
}
async function accusa(R){
  const P=G.P,Q=G.Q;let ok=true;const sep=()=>{scr.col=0;pr('{d}   *****  ACCUSA  *****');scr.col=11;};
  sep();for(let j=1;j<=10;j++)pr((j<10?' ':'')+j+': '+cap(S[j][0])+'.');
  scr.col=0;let a=await input('Numero della vittima');if(a!==P[35])ok=false;
  sep();for(let j=1;j<=10;j++)pr((j<10?' ':'')+j+': '+cap(S[j][0])+'.');
  scr.col=0;a=await input("Numero dell'assassino");if(a!==P[32])ok=false;
  sep();for(let j=1;j<=12;j++)pr((j<10?' ':'')+j+': '+cap(S[j+10][0])+'.');
  scr.col=0;a=await input("Numero dell'arma");if(a!==P[33])ok=false;
  sep();for(let j=1;j<=14;j++)pr((j<10?' ':'')+j+': '+cap(RM[j][0])+'.');
  scr.col=0;a=await input('Numero della stanza');if(a!==Math.abs(P[34]))ok=false;
  scr.col=11;pr('{d}Chiamo la polizia per l\'arresto......');siren(2.2);await sleep(2500);
  if(ok){scr.col=0;pr('{d}{r} LA TUA SOLUZIONE E\' ESATTA! {o}');tune(T_WIN,'square',.3);await sleep(400);pr('{d}Il giocatore n.'+Q+' ha risolto il caso!');await sleep(2200);return await soluzione();}
  scr.col=0;pr('{d}No!... E\' stato un arresto sbagliato!');await tune(T_FUNE,'square',.3);
  scr.col=11;const d=dropCarried();if(d)prw('Lasci '+item(d)+'.');P[35+Q]=0;P[50]++;pr('Sei fuori dal gioco!');
  if(P[50]<P[49])return false;
  await tune(T_TOCC1,'triangle',.55);await sleep(500);
  scr.col=0;pr('{d}Tutti i giocatori hanno dato una');pr('soluzione sbagliata!!');pr('{d}Nessuno vince!');await sleep(1500);
  return await soluzione();
}
async function soluzione(){
  const P=G.P;try{localStorage.removeItem(SAVE);}catch(e){}
  scr.col=0;pr('{d}Ecco la soluzione esatta:');scr.col=11;
  prw(cap(S[P[32]][0])+' ha ucciso '+S[P[35]][0]+' '+RM[Math.abs(P[34])][1]+', con '+S[P[33]+10][0]+'.');
  scr.col=0;pr('{d}Premi {r}RETURN{o} per una nuova partita.');await getk(['RETURN']);return true;
}
async function play(mode){
  if(mode==='new'){scr.border=0;scr.bg=1;scr.col=11;clr();pr('{d}{d}Tutti i giocatori tranne il n.1 devono');pr('lasciare la stanza.');pr('{d}   Giocatore n.1: premi {r} RETURN {o}');pr('       per cominciare la partita!');await getk(['RETURN']);}
  for(;;){if(await turn())return;}
}
async function main(){
  fit();await boot();
  for(;;){const m=await title();await play(m);}
}
