function fmt(n,d){d=d||0;const neg=n<0;let s=Math.abs(n).toFixed(d);let [i,f]=s.split('.');i=i.replace(/\B(?=(\d{3})+(?!\d))/g,'.');return(neg?'-':'')+i+(f?','+f:'')}

/* Importi in centesimi interi (BigInt): niente errori di virgola mobile, centesimi sempre visibili */
function toC(v){return BigInt(Math.round(Number(v)*100))}
function fmtC(c){c=BigInt(c);const neg=c<0n;if(neg)c=-c;const i=(c/100n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.'),f=(c%100n).toString().padStart(2,'0');return(neg?'-':'')+i+','+f}

function pad(s,n){s=String(s);return s.length>=n?s.slice(0,n):s+' '.repeat(n-s.length)}

function build(d,th){if(d==='BREAK')return 'BREAK';const k=d[0],v=d[1],c=d[2];const L=[];

function paginate(items,th,avail){const pages=[];let pg=[];

    const need=b.length-(b.length&&b[b.length-1].length===0?1:0);

    b.forEach(l=>{if(pg.length>=avail){if(l.length===0)return;pages.push(pg);pg=[]}if(pg.length===0&&l.length===0)return;pg.push(l)})});
  if(pg.length)pages.push(pg);return pages.length?pages:[[]]}

function askNumber(o){let s=o.def!==undefined&&o.def!==null?(o.unit==='eur'&&o.def%1?Number(o.def).toFixed(2):String(o.def)).replace('.',','):'';let fresh=s!=='';let err=null;
  const th=o.th;
  function key(k){
    if(/^[0-9]$/.test(k)){if(fresh){s='';fresh=false}const parts=s.split(',');
      if(parts.length===2){if(parts[1].length<(o.dec||0))s+=k;else sfx.err()}else if(parts[0].length<7){s=(s==='0'?'':s)+k}else sfx.err()}
    else if(k===','){if(!o.dec)sfx.err();else{if(fresh){s='0';fresh=false}if(!s.includes(','))s=(s||'0')+','}}
    else if(k==='DEL'){fresh=false;s=s.slice(0,-1)}
    else if(k==='C'){fresh=false;s=''}
    else if(k==='ESC'){o.onBack();return}
    else if(k==='OK'){const v=parseFloat(s.replace(',','.'));
      if(s===''||isNaN(v)||v<o.min||v>o.max){err=['?REDO FROM START','Scrivi un numero da '+(o.unit==='eur'?eurC(toC(o.min))+' a '+eurC(toC(o.max)):fmt(o.min)+' a '+fmt(o.max))+'.'];sfx.err();draw();return}
      sfx.sel();o.onOK(v);return}
    err=null;draw()}
  function draw(){cls(th.bg,th.bd,th.fg);header(o.title,o.right||'',th.hbg,th.hfg,o.onBack);
    let y=4;if(o.step){put(1,y,o.step,th.dim);y+=2}
    wrap(o.label,CW).forEach(l=>{put(1,y,l,th.hd);y++});

    y+=2;

    else if(fresh)wrap('Tocca OK per confermare, oppure scrivi un altro numero.',CW).forEach((l,i)=>put(1,y+i,l,th.dim));
    keypad(th,o.dec,key)}

function drawPig(x,y,bg){PIG.forEach((r,i)=>put(x,y+i,r[0],r[1],bg));put(x+7,y+2,'\u00b7',BLK,LRED)}
function objStart(){const th=TH.obj;S.obj=S.obj||{};
  const steps=[
   {k:'costo',l:'QUANTO COSTA?',h:'Il prezzo della cosa che vuoi comprare: una vacanza, un elettrodomestico, un regalo.',min:1},
   {k:'gia',l:'QUANTO HAI GIA\'?',h:'I soldi che hai gi\u00e0 messo da parte per questo obiettivo. Se non hai niente scrivi 0.',min:0},
   {k:'mese',l:'QUANTO AL MESE?',h:'La cifra che puoi mettere da parte ogni mese.',min:1}];
  function step(i){const f=steps[i];
    askNumber({th,title:'OBIETTIVO',right:(i+1)+'/3',step:'PASSO '+(i+1)+' DI 3',label:f.l+' (EURO)',help:f.h,def:S.obj[f.k]!==undefined?S.obj[f.k]:(i===1?0:null),
      min:f.min,max:9999999.99,dec:2,unit:'eur',onBack:()=>{if(i>0)step(i-1);else intro()},
      onOK:v=>{S.obj[f.k]=v;save();if(i===1&&v>=S.obj.costo)return objReport();if(i<2)step(i+1);else objReport()}})}
  function intro(){show(function draw(){cls(th.bg,th.bd,th.fg);header('OBIETTIVO RISPARMIO','',th.hbg,th.hfg,mainMenu);
    drawPig(9,5,-1);let y=13;
    ['Vuoi comprare qualcosa senza fare debiti? Mettere da parte un po\' ogni mese \u00e8 il modo pi\u00f9 sicuro.','Scrivi quanto costa, quanto hai gi\u00e0 e quanto puoi risparmiare al mese: ti dico quando ci arrivi.']
      .forEach(p=>{wrap(p,CW).forEach(l=>{put(1,y,l,th.fg);y++});y++});
    y++;button(1,y,CW,3,'COMINCIA',YEL,BLK,()=>step(0),['OK','1']);y+=4;
    button(1,y,CW,3,'\u25c4 TORNA AL MENU',BLK,WHT,mainMenu,['ESC'])},mainMenu)}
  intro()}
function mesiTxt(m){const a=Math.floor(m/12),r=m%12;const p=[];if(a)p.push(a+(a===1?' anno':' anni'));if(r||!a)p.push(r+(r===1?' mese':' mesi'));return p.join(' e ')}
function objReport(){const o=S.obj,th=TH.obj;const eur=(n)=>eurC(toC(n));const cC=Math.round(o.costo*100),gC=Math.round(o.gia*100),mC=Math.round(o.mese*100);const rest=Math.max(0,cC-gC)/100;const items=[];
  items.push(['lines',PIG.map((r,i)=>i===2?[[8,r[0],r[1]],[15,'\u00b7',BLK,LRED]]:[[8,r[0],r[1]]]).concat([[]])]);
  items.push(['t',[['Obiettivo',eur(o.costo)],['Hai gi\u00e0',eur(o.gia)],['Mancano',eur(rest),rest?YEL:LGRN]]]);
  const fr=Math.min(1,o.gia/o.costo);
  items.push(['lines',[[[0,'A che punto sei: '+fmt(fr*100,0)+'%',WHT]],[[0,'\u2592'.repeat(CW),LRED],[0,barStr(fr,CW),YEL]],[]]]);
  if(!rest){items.push(['r','Hai gi\u00e0 raggiunto l\'obiettivo! Puoi comprarlo senza debiti.',GRN])}
  else{const m=Math.ceil((cC-gC)/mC);items.push(['f','CI ARRIVI IN '+m+(m===1?' MESE':' MESI')]);
    if(m>=12)items.push(['p','Cio\u00e8 '+mesiTxt(m)+', mettendo da parte '+eur(o.mese)+' al mese.']);
    else items.push(['p','Mettendo da parte '+eur(o.mese)+' al mese.']);
    const m2=Math.ceil((cC-gC)/Math.ceil(mC*12/10));
    if(m2<m)items.push(['r','Con il 20% in pi\u00f9 al mese ('+eur(Math.ceil(mC*12/10)/100)+') ci arrivi in '+mesiTxt(m2)+'.']);
    items.push(['p','Consiglio: tieni questi soldi separati dal conto di tutti i giorni.',YEL])}
  pager({th,title:'OBIETTIVO',right:'RISULTATO',items,onBack:objStart,backLabel:'RIFAI',endLabel:'MENU',onEnd:mainMenu})}
/* ===== Interesse composto ===== */
function simStart(){const th=TH.sim;S.sim=S.sim||{};
  const steps=[
   {k:'ini',l:'CAPITALE INIZIALE',h:'Quanto metti subito. Se parti da zero scrivi 0. Per i centesimi usa il tasto ",".',min:0,max:9999999.99,dec:2,unit:'eur',def:0},
   {k:'mese',l:'VERSAMENTO MENSILE',h:'Quanto aggiungi ogni mese. Se hai un capitale iniziale puoi scrivere 0.',min:0,max:999999.99,dec:2,unit:'eur',def:100},
   {k:'anni',l:'PER QUANTI ANNI?',h:'Da 1 a 50 anni.',min:1,max:50,dec:0,unit:'anni',def:10},
   {k:'tasso',l:'TASSO ANNUO (%)',h:'Il rendimento all\'anno, per esempio 3. Per la virgola usa il tasto ",".',min:0,max:20,dec:2,unit:'%',def:3}];
  function step(i){const f=steps[i];
    askNumber({th,title:'INTERESSE COMPOSTO',right:(i+1)+'/4',step:'PASSO '+(i+1)+' DI 4',label:f.l,help:f.h,def:S.sim[f.k]!==undefined?S.sim[f.k]:f.def,
      min:(f.k==='mese'&&!S.sim.ini)?0.01:f.min,max:f.max,dec:f.dec,unit:f.unit,onBack:()=>{if(i>0)step(i-1);else intro()},
      onOK:v=>{S.sim[f.k]=v;save();if(i<3)step(i+1);else simReport()}})}
  function intro(){show(function draw(){cls(th.bg,th.bd,th.fg);header('INTERESSE COMPOSTO','',th.hbg,th.hfg,mainMenu);
    let y=4;
    ['Guarda come crescono i risparmi quando anche gli interessi producono interessi.','Scrivi quanto metti all\'inizio, quanto aggiungi ogni mese, per quanti anni e a che tasso.','Gli interessi si calcolano ogni mese. Il calcolo non tiene conto di tasse, costi e inflazione.']
      .forEach(p=>{wrap(p,CW).forEach(l=>{put(1,y,l,th.fg);y++});y++});
    y++;button(1,y,CW,3,'COMINCIA',YEL,BLK,()=>step(0),['OK','1']);y+=4;
    if(S.sim.anni){button(1,y,CW,3,'VEDI L\'ULTIMO CALCOLO',ORA,WHT,simReport,['2']);y+=4}
    button(1,y,CW,3,'\u25c4 TORNA AL MENU',BLK,YEL,mainMenu,['ESC'])},mainMenu)}
  intro()}
function simReport(){const s=S.sim,th=TH.sim;
  /* Calcolo in centesimi interi: ogni mese l'interesse e' arrotondato al centesimo (0,5 per eccesso), poi si aggiunge il versamento */
  const tb=BigInt(Math.round(s.tasso*100)),mc=toC(s.mese);let bal=toC(s.ini),vers=bal;const yrs=[];
  for(let m=1;m<=s.anni*12;m++){bal+= (bal*tb*2n+120000n)/240000n + mc;vers+=mc;if(m%12===0)yrs.push({a:m/12,v:vers,t:bal})}
  const fin=yrs[yrs.length-1];
  const items=[['h','RISULTATO DOPO '+s.anni+(s.anni===1?' ANNO':' ANNI')],
   ['t',[['Hai versato',eurC(fin.v)],['Interessi',eurC(fin.t-fin.v),LGRN],['Totale',eurC(fin.t),YEL]]]];
  if(s.tasso>0){const r72=72/s.tasso;items.push(['p','Regola del 72: al '+fmt(s.tasso,s.tasso%1?1:0)+'% un capitale raddoppia in circa '+fmt(r72,r72<10?1:0)+' anni.'])}
  if(fin.v>0n)items.push(['p','Gli interessi sono il '+fmt(Number(fin.t-fin.v)/Number(fin.t)*100,0)+'% del totale finale.',LGRY]);
  items.push(['r','Esempio teorico: tasse, costi e inflazione abbassano il risultato. I rendimenti non sono garantiti.']);
  items.push('BREAK');
  const lines=[[[0,'\u2588',LBLU],[2,'versato',WHT],[11,'\u2588',YEL],[13,'interessi',WHT]],[[0,'ANNO',LGRY],[CW-13,'TOTALE (EURO)',LGRY]]];
  const maxRows=ROWS-9-3,stp=Math.ceil(yrs.length/maxRows);const mx=Number(fin.t)||1;
  const tv=yrs.map(y=>fmtC(y.t)),nw=Math.max(9,...tv.map(x=>x.length)),bw=Math.max(3,CW-3-1-nw);
  yrs.forEach((y,i)=>{if((i+1)%stp!==0&&i!==yrs.length-1&&i!==0)return;
    const tw=Math.max(y.t>0n?1:0,Math.round(Number(y.t)/mx*bw)),vw=Math.min(tw,Math.round(Number(y.v)/mx*bw));
    lines.push([[0,lpad(y.a,2),WHT],[3,'\u2588'.repeat(vw),LBLU],[3+vw,'\u2588'.repeat(tw-vw),YEL],[CW-nw,lpad(tv[i],nw),WHT]])});
  items.push(['lines',lines]);
  pager({th,title:'INTERESSE COMPOSTO',right:'',items,onBack:simStart,backLabel:'RIFAI',endLabel:'MENU',onEnd:mainMenu})}
/* ===== Quiz ===== */
const QUIZ=[
 ['Il saldo del mese \u00e8...',['entrate meno uscite','entrate pi\u00f9 uscite','solo le spese fisse'],'Saldo = entrate - uscite. Se \u00e8 positivo stai risparmiando.'],
 ['Quale di queste \u00e8 una spesa fissa?',['l\'affitto','una cena fuori','un regalo di compleanno'],'L\'affitto \u00e8 quasi uguale ogni mese: \u00e8 una spesa fissa.'],
 ['Con la regola 50/30/20, quanto va al risparmio?',['il 20%','il 30%','il 50%'],'50% bisogni, 30% desideri, 20% risparmio e debiti.'],
 ['Su 2.000 \u20ac al mese, la regola 50/30/20 d\u00e0 ai bisogni...',['1.000 \u20ac','600 \u20ac','400 \u20ac'],'Il 50% di 2.000 \u20ac fa 1.000 \u20ac.'],
 ['Un fondo emergenze di solito copre...',['3-6 mesi di spese essenziali','una settimana di spesa','dieci anni di stipendio'],'Da 3 a 6 mesi di spese essenziali.'],
 ['1.000 \u20ac al 10% composto l\'anno, dopo 2 anni diventano...',['1.210 \u20ac','1.200 \u20ac','1.100 \u20ac'],'1.000 x 1,10 = 1.100, poi 1.100 x 1,10 = 1.210 \u20ac.'],
 ['Con la regola del 72, al 6% l\'anno un capitale raddoppia in circa...',['12 anni','6 anni','72 anni'],'72 diviso 6 fa 12.'],
 ['Se i prezzi salgono e i tuoi soldi restano fermi nel cassetto...',['comprano un po\' meno','valgono di pi\u00f9','non cambia niente'],'L\'inflazione riduce quello che puoi comprare con gli stessi soldi.'],
 ['Il TAEG di un prestito indica...',['il costo totale annuo, spese comprese','solo la rata mensile','il numero delle rate'],'Il TAEG comprende interessi e spese: serve per confrontare i prestiti.'],
 ['"Paga prima te stesso" significa...',['risparmiare appena arrivano i soldi','spendere tutto per s\u00e9','pagare i debiti per ultimi'],'Metti da parte subito una cifra fissa, poi spendi il resto.'],
 ['Quale \u00e8 un desiderio e non un bisogno?',['un telefono nuovo se il vecchio va bene','la bolletta della luce','la spesa per mangiare'],'Il telefono nuovo \u00e8 piacevole ma rinunciabile.'],
 ['Per tagliare le spese conviene partire da...',['spese variabili e abbonamenti inutili','le medicine','l\'affitto'],'Le spese variabili si possono cambiare subito, ogni giorno.']];
function quizStart(){const qs=shuffle(QUIZ).slice(0,10).map(q=>{const opts=shuffle(q[1].map((t,i)=>({t,ok:i===0})));return{q:q[0],opts,ex:q[2]}});
  let i=0,score=0,ans=null;const th=TH.quiz;
  function draw(){cls(th.bg,th.bd,th.fg);header('QUIZ','DOMANDA '+(i+1)+'/10',th.hbg,th.hfg,mainMenu);
    const q=qs[i];put(1,4,'PUNTI: '+score,YEL);let y=6;
    wrap(q.q,CW).forEach(l=>{put(1,y,l,CYN);y++});y++;
    q.opts.forEach((o,j)=>{const ls=wrap(o.t,CW-4);const h=ls.length+2;let bg=[LBLU,PUR,ORA][j],fg=WHT;
      if(ans!==null){if(o.ok){bg=GRN}else if(j===ans){bg=RED}else{bg=DGRY;fg=GRY}}
      fill(1,y,CW,h,bg,' ',fg);put(2,y+1,'ABC'[j],bg,fg);ls.forEach((l,k)=>put(4,y+1+k,l,fg,bg));
      if(ans===null)hotspot(1,y,CW,h,()=>answer(j),['ABC'[j],String(j+1)]);y+=h+1});
    if(ans!==null){const ok=q.opts[ans].ok;put(1,y,ok?'GIUSTO!':'SBAGLIATO.',ok?LGRN:LRED);y++;
      wrap(q.ex,CW).forEach(l=>{put(1,y,l,WHT);y++});
      button(1,ROWS-4,CW,3,i<9?'AVANTI \u25ba':'VEDI IL PUNTEGGIO \u25ba',CYN,BLK,()=>{if(i<9){i++;ans=null;draw()}else end()},['OK','NEXT'])}
  }
  function answer(j){ans=j;if(qs[i].opts[j].ok){score++;sfx.ok()}else sfx.bad();draw()}
  function end(){const best=Math.max(S.best||0,score),rec=score>(S.best||0)&&score>0;S.best=best;save();
    show(function drawEnd(){cls(th.bg,th.bd,th.fg);header('QUIZ','FINE',th.hbg,th.hfg,mainMenu);
      let y=6;center(y,' HAI FATTO '+score+' SU 10 ',BLK,score>=7?LGRN:score>=5?YEL:LRED);y+=2;
      center(y,'\u2588'.repeat(score)+'\u2592'.repeat(10-score),score>=7?LGRN:score>=5?YEL:LRED);y+=2;
      const msg=score===10?'Perfetto! Sei un vero esperto del bilancio di casa.':score>=7?'Molto bene! Conosci le regole del risparmio.':score>=5?'Discreto. Ripassa le lezioni per fare meglio.':'Non scoraggiarti: leggi le lezioni e riprova.';
      wrap(msg,CW).forEach(l=>{put(1,y,l,WHT);y++});y++;
      put(1,y,'RECORD: '+best+' SU 10',CYN);if(rec)put(18,y,'NUOVO!',YEL);y+=3;
      button(1,y,CW,3,'RIGIOCA',CYN,BLK,quizStart,['OK','1']);y+=4;
      button(1,y,CW,3,'LEZIONI',LBLU,WHT,lessonList,['2']);y+=4;
      button(1,y,CW,3,'\u25c4 TORNA AL MENU',DGRY,WHT,mainMenu,['ESC']);
    },mainMenu);sfx.sel()}
  show(draw,mainMenu)}
/* ===== Menu principale ===== */
function mainMenu(){
  show(function draw(){cls(BLK,BLU,WHT);
    fill(0,0,COLS,1,ORA,'\u2580',RED);fill(0,1,COLS,1,LGRN,'\u2580',YEL);
    put(1,3,' IL SALVADANAIO ',BLK,YEL);put(1,4,' 64 ',WHT,RED);
    put(1,6,'Corso di',LGRY);put(1,7,'economia',LGRY);put(1,8,'domestica',LGRY);put(1,9,'VERSIONE ITALIANA',CYN);
    drawPig(18,3,-1);
    fill(0,10,COLS,1,LBLU,'\u2580',CYN);fill(0,11,COLS,1,BLU,'\u2580',PUR);
    const items=[['LEZIONI',LBLU,WHT,lessonList],['IL MIO BILANCIO',GRN,WHT,bilancioStart],['OBIETTIVO RISPARMIO',PUR,WHT,objStart],
      ['INTERESSE COMPOSTO',ORA,WHT,simStart],['QUIZ',RED,WHT,quizStart],['SUONO: '+(S.snd?'SI':'NO'),DGRY,LGRY,()=>{S.snd=!S.snd;save();if(S.snd){audioInit();sfx.sel()}draw()}],
      ['FINE PROGRAMMA',GRY,BLK,fine]];
    const slot=Math.max(4,Math.floor((ROWS-5-13)/7)),h=Math.min(5,slot-1),gap=slot-h;
    items.forEach((it,i)=>{const y=13+i*slot,m=y+Math.floor(h/2);button(1,y,CW,h,'',it[1],it[2],()=>{sfx.sel();it[3]()},[String(i+1)]);
      put(2,m,String(i+1),it[1],it[2]);put(5,m,it[0],it[2],it[1])});
    put(1,ROWS-3,'READY.',LGRY);put(COLS-1-12,ROWS-5,'ByCSD \u00b7 v1.0',WHT);put(1,ROWS-2,'TOCCA UNA VOCE O PREMI 1-7',GRY);
  },null)}
function fine(){show(function draw(){cls(BLU,LBLU,LBLU);put(0,1,'BREAK IN 30');put(0,2,'READY.');
    put(0,3,'LIST 10-30');put(0,4,'10 REM IL SALVADANAIO 64');put(0,5,'20 PRINT "RISPARMIA OGNI MESE"');put(0,6,'30 GOTO 20');put(0,7,'READY.');cursor={x:0,y:8};
    button(1,11,CW,3,'RUN  (RIPARTI)',LBLU,WHT,mainMenu,['OK','R']);
    wrap('Il programma \u00e8 fermo. Tocca RUN per tornare al menu.',CW).forEach((l,i)=>put(1,15+i,l,LBLU));
  },mainMenu)}
/* ===== Accensione e caricamento da cassetta ===== */
let skipFlag=false,wake=null;
const w=ms=>new Promise(r=>{wake=r;setTimeout(r,ms)});
/* BASIC iniziale: RUN avvia il caricamento; il gesto abilita audio e schermo intero. */
function power(){show(function draw(){mode='text';bootLines=[];typing='';bootScreen();
  button(7,Math.floor(ROWS/2)-2,15,5,['RUN','','AVVIO'],WHT,BLK,()=>{audioInit();goFull();boot()},['OK','R']);
},null)}
async function boot(){skipFlag=false;cur=bootScreen;anyTap=null;hot=[];
  mode='text';bootLines=[];typing='';bootScreen();await w(900);if(skipFlag)return;
  await type('LOAD"SALVADANAIO"');if(skipFlag)return;await w(250);
  bootLines.push('');bootLines.push('PRESS PLAY ON TAPE');bootScreen(true);await w(900);if(skipFlag)return;
  bootLines.push('OK');bootScreen(true);await w(400);if(skipFlag)return;
  bootLines.push('');bootLines.push('SEARCHING FOR SALVADANAIO');bootScreen(true);await w(300);if(skipFlag)return;
  mode='pilot';tapeOn();await w(1100);if(skipFlag)return;
  mode='text';tapeOff();bootLines.push('FOUND SALVADANAIO');bootScreen(true);await w(800);if(skipFlag)return;
  mode='data';tapeOn();await w(2200);if(skipFlag)return;
  mode='text';tapeOff();bootLines.push('LOADING');bootLines.push('READY.');bootScreen();await w(500);if(skipFlag)return;
  await type('RUN');if(skipFlag)return;await w(400);if(skipFlag)return;endBoot()}
let bootLines=[],typing='';
function bootScreen(nocur){cls(BLU,LBLU,LBLU);center(1,'*** COMMODORE 64 BASIC V2 ***');put(0,3,' 64K RAM SYSTEM');put(0,4,' 38911 BASIC BYTES FREE');put(0,6,'READY.');
  let y=7;bootLines.forEach(l=>{put(0,y,l);y++});if(typing!==null)put(0,y,typing);if(!nocur)cursor={x:typing?typing.length:0,y:y}}
async function type(s){typing='';for(const c of s){typing+=c;bootScreen();sfx.click();await w(110);if(skipFlag)return}
  bootLines.push(typing);typing='';bootScreen()}
function endBoot(){anyTap=null;tapeOff();mode='text';typing='';sfx.sel();mainMenu()}
/* ===== Avvio ===== */
window.addEventListener('resize',()=>{layout()});
layout();power();requestAnimationFrame(loop);
</script>
